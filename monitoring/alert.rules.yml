groups:
  # Feed Handler Alerts
  - name: feed-handlers
    interval: 10s
    rules:
      - alert: FeedHandlerDisconnected
        expr: up{job="feed-handlers"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Feed handler service is down"
          description: "The feed handler service {{ $labels.instance }} has been down for more than 1 minute"

      - alert: FeedHandlerHighLatency
        expr: histogram_quantile(0.99, sum(rate(feed_handler_latency_seconds_bucket{job="feed-handlers"}[5m])) by (le, instance)) > 0.1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency for feed handler {{ $labels.instance }}"
          description: "99th percentile latency for {{ $labels.instance }} is {{ $value }}s (threshold: 0.1s)"

      - alert: FeedHandlerNoMessages
        expr: rate(feed_handler_messages_received_total{job="feed-handlers"}[5m]) == 0
        for: 5m
        labels:
          severity: warning
          category: data
        annotations:
          summary: "No messages received by feed handler {{ $labels.instance }}"
          description: "Feed handler {{ $labels.instance }} has not received any messages in the last 5 minutes"

      - alert: FeedHandlerHighErrorRate
        expr: rate(feed_handler_errors_total{job="feed-handlers"}[5m]) > 10
        for: 5m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "High error rate for feed handler {{ $labels.instance }}"
          description: "Feed handler {{ $labels.instance }} has {{ $value }} errors per second (threshold: 10)"

      - alert: FeedHandlerExchangeDisconnected
        expr: feed_handler_exchange_connected{job="feed-handlers"} == 0
        for: 1m
        labels:
          severity: critical
          category: connectivity
        annotations:
          summary: "Exchange connection lost for {{ $labels.exchange }}"
          description: "Feed handler {{ $labels.instance }} lost connection to exchange {{ $labels.exchange }}"

  # Aeron Alerts
  - name: aeron
    interval: 10s
    rules:
      - alert: AeronHighBufferUtilization
        expr: aeron_buffer_utilization_bytes / aeron_buffer_capacity_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High buffer utilization for Aeron channel {{ $labels.channel }}"
          description: "Buffer utilization is {{ $value }} (threshold: 0.8)"

      - alert: AeronMessageBacklog
        expr: aeron_messages_in_buffer > 10000
        for: 2m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Message backlog in Aeron buffer {{ $labels.channel }}"
          description: "There are {{ $value }} messages in the buffer (threshold: 10000)"

      - alert: AeronPublicationError
        expr: rate(aeron_publication_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "Aeron publication errors detected"
          description: "Aeron publication {{ $labels.publication }} has {{ $value }} errors per second"

  # Trading Algorithm Alerts
  - name: algorithms
    interval: 10s
    rules:
      - alert: AlgorithmNotRunning
        expr: up{job="algorithms"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Algorithm service is down"
          description: "The algorithm service {{ $labels.instance }} has been down for more than 1 minute"

      - alert: AlgorithmHighLatency
        expr: histogram_quantile(0.99, sum(rate(algo_latency_seconds_bucket{job="algorithms"}[5m])) by (le, algorithm)) > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency for algorithm {{ $labels.algorithm }}"
          description: "99th percentile latency for {{ $labels.algorithm }} is {{ $value }}s (threshold: 0.5s)"

      - alert: AlgorithmNoSignals
        expr: rate(algo_signals_generated_total{job="algorithms"}[15m]) == 0
        for: 15m
        labels:
          severity: warning
          category: data
        annotations:
          summary: "No signals generated by algorithm {{ $labels.algorithm }}"
          description: "Algorithm {{ $labels.algorithm }} has not generated any signals in the last 15 minutes"

      - alert: AlgorithmHighPnL
        expr: algo_pnl_usd{job="algorithms"} > 10000
        for: 1m
        labels:
          severity: info
          category: trading
        annotations:
          summary: "High P&L for algorithm {{ $labels.algorithm }}"
          description: "Algorithm {{ $labels.algorithm }} has P&L of ${{ $value }} (threshold: $10000)"

      - alert: AlgorithmNegativePnL
        expr: algo_pnl_usd{job="algorithms"} < -5000
        for: 1m
        labels:
          severity: warning
          category: trading
        annotations:
          summary: "Negative P&L for algorithm {{ $labels.algorithm }}"
          description: "Algorithm {{ $labels.algorithm }} has P&L of ${{ $value }} (threshold: -$5000)"

  # Execution Service Alerts
  - name: execution-services
    interval: 10s
    rules:
      - alert: ExecutionServiceDown
        expr: up{job="execution-services"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Execution service is down"
          description: "The execution service {{ $labels.instance }} has been down for more than 1 minute"

      - alert: HighExecutionLatency
        expr: histogram_quantile(0.99, sum(rate(execution_latency_seconds_bucket{job="execution-services",operation="fill"}[5m])) by (le, exchange)) > 1
        for: 5m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "High execution latency for {{ $labels.exchange }}"
          description: "99th percentile fill latency for {{ $labels.exchange }} is {{ $value }}s (threshold: 1s)"

      - alert: ExecutionServiceHighErrorRate
        expr: rate(execution_errors_total{job="execution-services"}[5m]) > 5
        for: 5m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "High error rate for execution service {{ $labels.instance }}"
          description: "Execution service {{ $labels.instance }} has {{ $value }} errors per second (threshold: 5)"

      - alert: ExchangeConnectionLost
        expr: execution_exchange_connected{job="execution-services"} == 0
        for: 1m
        labels:
          severity: critical
          category: connectivity
        annotations:
          summary: "Exchange connection lost for {{ $labels.exchange }}"
          description: "Execution service {{ $labels.instance }} lost connection to exchange {{ $labels.exchange }}"

      - alert: OrderReconciliationFailure
        expr: execution_reconciliation_failures_total{job="execution-services"} > 0
        for: 1m
        labels:
          severity: critical
          category: data
        annotations:
          summary: "Order reconciliation failure detected"
          description: "Execution service {{ $labels.instance }} has {{ $value }} reconciliation failures"

  # Risk Service Alerts
  - name: risk
    interval: 10s
    rules:
      - alert: RiskServiceDown
        expr: up{job="risk-service"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Risk service is down"
          description: "The risk service has been down for more than 1 minute"

      - alert: PositionLimitBreach
        expr: risk_position_utilization{job="risk-service"} > 0.95
        for: 1m
        labels:
          severity: critical
          category: risk
        annotations:
          summary: "Position limit breach for {{ $labels.instrument }}"
          description: "Position utilization for {{ $labels.instrument }} is {{ $value }} (threshold: 0.95)"

      - alert: ExposureLimitBreach
        expr: risk_exposure_utilization{job="risk-service"} > 0.9
        for: 1m
        labels:
          severity: critical
          category: risk
        annotations:
          summary: "Exposure limit breach"
          description: "Overall exposure utilization is {{ $value }} (threshold: 0.9)"

      - alert: LossLimitBreach
        expr: risk_daily_loss_usd{job="risk-service"} > 10000
        for: 1m
        labels:
          severity: critical
          category: risk
        annotations:
          summary: "Daily loss limit breach"
          description: "Daily loss is ${{ $value }} (threshold: $10000)"

      - alert: FatFingerDetected
        expr: risk_fat_finger_events_total{job="risk-service"} > 0
        for: 1m
        labels:
          severity: critical
          category: risk
        annotations:
          summary: "Fat finger event detected"
          description: "Risk service detected {{ $value }} fat finger events"

      - alert: RiskActionTaken
        expr: rate(risk_actions_taken_total{job="risk-service"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          category: risk
        annotations:
          summary: "Risk action taken"
          description: "Risk service took {{ $value }} actions in the last 5 minutes"

  # Market Data Recorder Alerts
  - name: market-data-recorder
    interval: 10s
    rules:
      - alert: MarketDataRecorderDown
        expr: up{job="market-data-recorder"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Market data recorder is down"
          description: "The market data recorder service has been down for more than 1 minute"

      - alert: MarketDataRecorderHighLatency
        expr: histogram_quantile(0.99, sum(rate(recorder_latency_seconds_bucket{job="market-data-recorder"}[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency for market data recorder"
          description: "99th percentile latency is {{ $value }}s (threshold: 0.5s)"

      - alert: MarketDataRecorderErrors
        expr: rate(recorder_errors_total{job="market-data-recorder"}[5m]) > 5
        for: 5m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "High error rate for market data recorder"
          description: "Market data recorder has {{ $value }} errors per second (threshold: 5)"

  # QuestDB Alerts
  - name: questdb
    interval: 10s
    rules:
      - alert: QuestDBDown
        expr: up{job="questdb"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "QuestDB is down"
          description: "QuestDB has been down for more than 1 minute"

      - alert: QuestDBHighMemoryUsage
        expr: questdb_memory_used_bytes / questdb_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High memory usage for QuestDB"
          description: "QuestDB memory usage is {{ $value }} (threshold: 0.9)"

      - alert: QuestDBHighDiskUsage
        expr: questdb_disk_used_bytes / questdb_disk_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High disk usage for QuestDB"
          description: "QuestDB disk usage is {{ $value }} (threshold: 0.9)"

  # NATS Alerts
  - name: nats
    interval: 10s
    rules:
      - alert: NATSServerDown
        expr: up{job="nats"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "NATS server is down"
          description: "NATS server has been down for more than 1 minute"

      - alert: NATSJetStreamHighStorage
        expr: nats_jetstream_bytes > 10000000000  # 10GB
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High storage usage for NATS JetStream"
          description: "NATS JetStream storage is {{ $value }} bytes (threshold: 10GB)"

      - alert: NATSJetStreamHighMessages
        expr: nats_jetstream_messages > 10000000  # 10M messages
        for: 5m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "High message count for NATS JetStream"
          description: "NATS JetStream has {{ $value }} messages (threshold: 10M)"

  # System Alerts
  - name: system
    interval: 10s
    rules:
      - alert: HighSystemMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }} (threshold: 0.9)"

      - alert: HighSystemCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}% (threshold: 90%)"

      - alert: HighSystemDiskUsage
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is {{ $value }} (threshold: 0.1 available)"
